<header id="header" class="header d-flex align-items-center fixed-top">
  <div class="container-fluid container-xl position-relative d-flex align-items-center">

    <a routerLink="/" class="logo d-flex align-items-center me-auto"
       (click)="closeMobileMenu()">
      <img src="assets/img/logo.png" alt="Logo">
    </a>

    <nav id="navmenu" class="navmenu">
        <ul>
            <li>
                <a routerLink="/" fragment="hero" (click)="closeMobileMenu()">Inicio</a>
            </li>
            <li>
            <a routerLink="explore-events" routerLinkActive="active"
                (click)="closeMobileMenu()">Explorar</a>
            </li>
            <li>        
            <a routerLink="/events" routerLinkActive="active"
                (click)="closeMobileMenu()">Mis Eventos</a>
            </li>
        </ul>

        <i class="mobile-nav-toggle d-xl-none bi"
            [class.bi-list]="!mobileMenuOpen"
            [class.bi-x]="mobileMenuOpen"
            (click)="toggleMobileMenu()">
        </i>
    </nav>

    <div class="d-flex align-items-center ms-auto">
      @if (currentUser) {
        <div class="d-flex align-items-center">
          <span class="d-none d-md-block me-4 text-white fw-bold">{{ currentUser.names }}</span>
          
          <button class="cta-btn border-0" (click)="logout()">Cerrar Sesión</button>
        </div>
      } @else {
        <button class="cta-btn border-0" (click)="openLoginModal()">
          Iniciar Sesión
        </button>
      }
    </div>

  </div>
</header>

@if (showLoginModal) {
  <app-login-modal (closeModal)="closeLoginModal()"></app-login-modal>
}
