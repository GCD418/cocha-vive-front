<section id="events" class="events-section section-with-bg py-5">
  <div class="container">

    <div class="section-header text-center mb-5">
      <h2>Próximos Eventos</h2>
      <p>Descubre lo que está pasando en la ciudad</p>
    </div>

    <div class="row g-4">
      
      @for (eventItem of events; track eventItem) {
        <div class="col-12 col-md-6 col-lg-4">
          <app-event-card-component [event]="eventItem"></app-event-card-component>
        </div>
      }

    </div>

  </div>
</section>
