<section id="events" class="events-section section-with-bg py-5">
  <div class="container">
    <div class="section-header section-title text-center">
      <h2>{{ 'UPCOMING_EVENTS.TITLE' | translate }}</h2>
      <p>{{ 'UPCOMING_EVENTS.SUBTITLE' | translate }}</p>
    </div>

    <div class="row g-4">

      @for (eventItem of events(); track eventItem.id) {
      <div class="col-12 col-md-6 col-lg-4">
        <app-event-card-component [event]="eventItem"></app-event-card-component>
      </div>
      } @empty {
          <div class="col-12">
            <div class="empty-state text-center">
              <i class="bi bi-calendar-x empty-state-icon"></i>
              <p class="empty-state-text mb-0">{{ 'UPCOMING_EVENTS.EMPTY' | translate }}</p>
            </div>
          </div>
        }
      
    </div>

  </div>
</section>
