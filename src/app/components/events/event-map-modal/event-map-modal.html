<div class="modal fade" id="eventMapModal" tabindex="-1" aria-hidden="true"
     role="dialog" aria-modal="true" aria-labelledby="event-map-modal-title" aria-describedby="event-map-modal-body">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" appFocusTrap>

      <div class="modal-header" style="background-color: #0e1b4d;">
        <h5 class="modal-title text-white" id="event-map-modal-title">
          <i class="bi bi-geo-alt-fill me-2" style="color: var(--cv-accent);"></i>
          {{ locationName || ('EVENT_MAP_MODAL.LABELS.LOCATION' | translate) }}
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>

      <div class="modal-body p-0" id="event-map-modal-body">
        @if (apiLoaded() && hasCoordinates()) {
          <google-map
            [center]="center()"
            [options]="mapOptions"
            width="100%"
            height="450px">
            <map-advanced-marker [position]="markerPosition()" />
          </google-map>
        } @else if (!apiLoaded()) {
          <div class="d-flex justify-content-center align-items-center"
                style="height: 450px;">
            <app-loading-spinner [message]="'EVENT_MAP_MODAL.LABELS.CHARGING_MAP' | translate"></app-loading-spinner>
          </div>
        } @else {
          <div class="d-flex justify-content-center align-items-center"
               style="height: 450px; background-color: #f2f2f3;">
            <p class="text-muted">{{ 'EVENT_MAP_MODAL.LABELS.UNAVAILABLE_LOCATION' | translate }}</p>
          </div>
        }
      </div>

      <div class="modal-footer">
        <button type="button" class="cv-btn-secondary"
                data-bs-dismiss="modal">{{'EVENT_MAP_MODAL.LABELS.CLOSE' | translate}}</button>
      </div>

    </div>
  </div>
</div>
