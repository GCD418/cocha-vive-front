<div class="card h-100 border-0 shadow-sm event-card">
  
  <div class="position-relative image-wrapper">
    <img 
      [src]="event.photoLinks && event.photoLinks.length > 0 ? event.photoLinks[0] : 'assets/img/event-placeholder.jpg'" 
      class="card-img-top" 
      [alt]="event.title">

    <span class="badge rounded-pill category-badge position-absolute top-0 start-0 m-3">
      {{ event.category.name }}
    </span>

    <span class="badge rounded-pill price-badge position-absolute top-0 end-0 m-3">
      <ng-container *ngIf="event.cost === 0; else showPrice">
        Gratis
      </ng-container>
      <ng-template #showPrice>
        Bs. {{ formattedPrice }}
      </ng-template>
    </span>
  </div>

  <div class="card-body p-4">
    <h5 class="card-title fw-bold mb-4">{{ event.title }}</h5>

    <ul class="list-unstyled event-details mb-0">
      <li class="mb-2 d-flex align-items-center">
        <i class="bi bi-calendar3 event-icon me-2"></i>
        <span>{{ event.dateStart | date:'dd MMM yyyy' }}</span>
      </li>
      <li class="mb-2 d-flex align-items-center">
        <i class="bi bi-clock event-icon me-2"></i>
        <span>{{ event.dateStart | date:'HH:mm' }}</span>
      </li>
      <li class="d-flex align-items-center">
        <i class="bi bi-geo-alt event-icon me-2"></i>
        <span class="text-truncate" [title]="event.shortPlaceDescription">
          {{ event.shortPlaceDescription || 'Lugar por confirmar' }}
        </span>
      </li>
    </ul>
  </div>
  
</div>
