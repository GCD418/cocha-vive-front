<div class="auth-modal-overlay" (click)="close()">
  <div class="auth-modal-card" (click)="$event.stopPropagation()">

    <button class="auth-modal-close" (click)="close()" aria-label="Cerrar">&times;</button>

    <div class="text-center mb-4">
      <h2 class="mb-1">{{ 'AUTH.MODAL_TITLE' | translate }}</h2>
      <p class="text-muted small mb-0">{{ 'AUTH.MODAL_WELCOME' | translate }}</p>
    </div>

    <div class="d-flex flex-column gap-2">

      <div class="google-btn-wrapper">
        <asl-google-signin-button type="standard" size="large"></asl-google-signin-button>
      </div>

      <div class="auth-divider">
        <span>{{ 'AUTH.OR' | translate }}</span>
      </div>

      <button
        class="btn-facebook"
        (click)="loginWithFacebook()"
        [disabled]="isLoading()">
        <i class="bi bi-facebook"></i>
        {{ isLoading() ? ('AUTH.FACEBOOK_CONNECTING' | translate) : ('AUTH.FACEBOOK_BUTTON' | translate) }}
      </button>

    </div>

  </div>
</div>
