<div class="auth-modal-overlay" (click)="close.emit()">
  <div class="auth-modal-card" (click)="$event.stopPropagation()">

    <button class="auth-modal-close" (click)="close.emit()" aria-label="Cerrar">&times;</button>

    @if (facebookName || facebookPhotoUrl) {
      <div class="d-flex flex-column align-items-center gap-2 mb-3">
        @if (facebookPhotoUrl) {
          <img class="fb-avatar" [src]="facebookPhotoUrl" [alt]="facebookName" />
        } @else {
          <div class="fb-avatar-placeholder">
            <i class="bi bi-person-fill"></i>
          </div>
        }
        @if (facebookName) {
          <span class="fw-semibold small">{{ facebookName }}</span>
        }
      </div>
    }

    <div class="text-center mb-3">
      <h2 class="mb-1">{{ 'AUTH.EMAIL_MODAL_TITLE' | translate }}</h2>
      <p class="text-muted small mb-0">{{ 'AUTH.EMAIL_MODAL_SUBTITLE' | translate }}</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-2">
        <input
          type="email"
          class="email-input"
          [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          [disabled]="isLoading" />

        @if (emailError) {
          <div class="text-danger mt-1" style="font-size: 0.8rem;">{{ emailError }}</div>
        }
      </div>

      <button
        type="submit"
        class="cta-btn border-0 w-100 mt-2"
        [disabled]="isLoading">
        {{ isLoading ? ('AUTH.EMAIL_SENDING' | translate) : ('AUTH.EMAIL_SUBMIT' | translate) }}
      </button>
    </form>

  </div>
</div>
