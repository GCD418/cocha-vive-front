<div class="container mt-5">
  <div class="row">
    <div class="col pt-5 mt-3">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"> Events List </h2>
      </div>

      <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-primary">
          <tr>
            <th class="text-center" style="width: 20%;">Evento</th>
            <th class="text-center" style="width: 45%;">Descripción</th>
            <th class="text-center" style="width: 15%;">Precio [Bs.]</th>
            <th class="text-center" style="width: 20%;">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (event of events; track event.id) {
            <tr>
              <td>{{ event.title }}</td>
              <td>{{ event.shortDescription }}</td>
              <td style="text-align: end;">{{ event.cost | price }}</td>
              <td class="text-center">
                <button (click)="eventDetails(event.id)" class="btn btn-info" style="margin-left: 10px;"> 
                  Detalles 
                </button>
                <button (click)="openEditModal(event)"
                        class="btn btn-warning btn-sm">
                  <i class="bi bi-pencil me-1"></i> Editar
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center italic text-muted">
                No hay eventos registrados actualmente.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="editEventModal" tabindex="-1"
     aria-labelledby="editEventModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
 
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="editEventModalLabel">
          <i class="bi bi-pencil-square me-2" style="color: var(--accent-color);"></i>
          Editar Evento
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
 
      <div class="modal-body p-4">
        @if (selectedEvent) {
          <app-event-form-component
            [eventToEdit]="selectedEvent"
            (formResult)="onEditFormResult($event)">
          </app-event-form-component>
        }
      </div>
 
    </div>
  </div>
</div>
