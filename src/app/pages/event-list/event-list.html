<div class="container mt-5">
  <div class="row">
    <div class="col pt-5 mt-3">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0"> Events List </h2>
        <button class="btn btn-primary" [routerLink]="['/events/create']">
          <i class="bi bi-plus-circle me-1"></i> Crear Evento
        </button>
      </div>

      <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-primary">
          <tr>
            <th class="text-center">Evento</th>
            <th class="text-center">Descripción</th>
            <th class="text-center">Precio [Bs.]</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (event of events; track event.id) {
            <tr>
              <td>{{ event.title }}</td>
              <td>{{ event.shortDescription }}</td>
              <td style="text-align: end;">{{ event.cost | price }}</td>
              <td class="text-center">
                <button (click)="eventDetails(event.id)" class="btn btn-info" style="margin-left: 10px;"> 
                  View 
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center italic text-muted">
                No hay eventos registrados actualmente.
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
