<div class="modal-overlay position-fixed top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" style="background-color: rgba(0,0,0,0.5); z-index: 9999;">
  <div class="modal-dialog modal-dialog-centered mb-0" style="min-width: 480px;">
    <div class="modal-content shadow">

      <div class="modal-header">
        <h5 class="modal-title fw-semibold">{{ title }}</h5>
        <button
          type="button"
          class="btn-close"
          [disabled]="loading"
          (click)="onCancel()"
          [attr.aria-label]="'CONFIRM_MODAL.CANCEL' | translate"
        ></button>
      </div>

      <div class="modal-body">
        <label class="form-label fw-semibold" for="rejectionReasonInput">
          {{ 'PUBLISHER_REQUESTS.REJECT_MODAL.REASON_LABEL' | translate }}
        </label>
        <textarea
          id="rejectionReasonInput"
          class="form-control"
          rows="4"
          [maxlength]="MAX_LENGTH"
          [ngModel]="rejectionReason()"
          (ngModelChange)="rejectionReason.set($event)"
          [placeholder]="'PUBLISHER_REQUESTS.REJECT_MODAL.REASON_PLACEHOLDER' | translate"
          [attr.aria-describedby]="'reasonHint reasonCounter'"
        ></textarea>

        <div class="d-flex justify-content-between mt-1">
          <div id="reasonHint" class="form-text text-danger small"
            [class.invisible]="rejectionReason().trim().length === 0 || isValid">
            {{ 'PUBLISHER_REQUESTS.REJECT_MODAL.REASON_MIN_ERROR' | translate }}
          </div>
          <div id="reasonCounter"
            class="form-text small ms-auto"
            [class.text-danger]="remainingChars < 50"
            [class.text-muted]="remainingChars >= 50">
            {{ remainingChars }} {{ 'PUBLISHER_REQUESTS.REJECT_MODAL.CHARS_REMAINING' | translate }}
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-secondary"
          [disabled]="loading"
          (click)="onCancel()">
          {{ 'CONFIRM_MODAL.CANCEL' | translate }}
        </button>
        <button
          type="button"
          class="btn btn-danger"
          [disabled]="!isValid || loading"
          (click)="onConfirm()">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
          }
          {{ 'PUBLISHER_REQUESTS.REJECT_MODAL.CONFIRM_BUTTON' | translate }}
        </button>
      </div>

    </div>
  </div>
</div>
