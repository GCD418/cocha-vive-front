<div class="modal-overlay" (click)="onCancel()" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <div class="modal-content" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" [attr.aria-label]="title">

    <button type="button" class="close-btn" aria-label="Cerrar" (click)="onCancel()" cdkFocusInitial>&times;</button>

    <div class="modal-body">
      <i class="bi bi-exclamation-triangle confirm-icon" aria-hidden="true"></i>
      <div class="modal-text">
        <h2 id="confirm-modal-title">{{ title }}</h2>
        <p id="confirm-modal-message">{{ message }}</p>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel-action" (click)="onCancel()" [attr.aria-label]="'Cancelar acción'">
        <i class="bi bi-x-circle me-1" aria-hidden="true"></i> {{ 'CONFIRM_MODAL.CANCEL' | translate }}
      </button>
      <button class="btn-confirm-action" (click)="onConfirm()" [disabled]="loading" [attr.aria-label]="confirmText">
        <i class="bi bi-check-circle me-1" aria-hidden="true"></i>
        {{ loading ? ('CONFIRM_MODAL.PROCESSING' | translate) : confirmText }}
      </button>
    </div>

  </div>
</div>
