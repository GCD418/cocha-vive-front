<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <button type="button" class="close-btn" aria-label="Close" (click)="onCancel()">&times;</button>

    <div class="modal-body">
      <i class="bi bi-exclamation-triangle confirm-icon" aria-hidden="true"></i>
      <div class="modal-text">
        <h2>{{ title }}</h2>
        <p>{{ message }}</p>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel-action" (click)="onCancel()">
        <i class="bi bi-x-circle me-1"></i> {{ 'CONFIRM_MODAL.CANCEL' | translate }}
      </button>
      <button class="btn-confirm-action" (click)="onConfirm()" [disabled]="loading">
        <i class="bi bi-check-circle me-1"></i>
        {{ loading ? ('CONFIRM_MODAL.PROCESSING' | translate) : confirmText }}
      </button>
    </div>

  </div>
</div>
